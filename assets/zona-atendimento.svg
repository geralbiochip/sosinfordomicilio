<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">Zona de atendimento Cascais–Lisboa</title><desc id="desc">Esquema ilustrativo do corredor Cascais, Estoril, Carcavelos, Oeiras e Lisboa. Sem representação da Margem Sul e sem escala geográfica.</desc><rect width="960" height="310" rx="16" fill="#f3f5f7"/><text x="45" y="45" fill="#26313c" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Zona de atendimento · Cascais a Lisboa</text><text x="45" y="72" fill="#66717e" font-family="Arial,sans-serif" font-size="14">Assistência ao domicílio mediante marcação</text><path d="M85 160H875" stroke="#e4ccd0" stroke-width="26" stroke-linecap="round"/><path d="M85 160H875" stroke="#b52c35" stroke-width="3"/><circle cx="85" cy="160" r="9" fill="white" stroke="#b52c35" stroke-width="3"/><text x="85" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26313c">Cascais</text><circle cx="270" cy="160" r="9" fill="white" stroke="#b52c35" stroke-width="3"/><text x="270" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26313c">Estoril</text><circle cx="465" cy="160" r="9" fill="white" stroke="#b52c35" stroke-width="3"/><text x="465" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26313c">Carcavelos</text><circle cx="660" cy="160" r="9" fill="white" stroke="#b52c35" stroke-width="3"/><text x="660" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26313c">Oeiras</text><circle cx="875" cy="160" r="9" fill="white" stroke="#b52c35" stroke-width="3"/><text x="875" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#26313c">Lisboa</text><text x="45" y="258" font-family="Arial,sans-serif" font-size="13" fill="#66717e">Esquema ilustrativo, sem escala. Confirma a tua localidade e as condições de deslocação.</text></svg>